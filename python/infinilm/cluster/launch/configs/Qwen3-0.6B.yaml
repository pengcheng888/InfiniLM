version: 1

model:
  path: /data-aisoft/mechdancer/models/Qwen3-0.6B
  served_model_name: Qwen3-0.6B
  # 启动时可依次用 INFINILM_MODEL_PATH、MODEL_PATH 或 MODEL 覆盖 path。

cluster:
  namespace: infinilm-agg
  run_dir: /tmp/infinilm-agg

discovery:
  backend: file
  file_kv: /tmp/infinilm-agg/discovery
  # etcd + kv-aware 时必须配置共享存储上的 cache_index_dir。
  # cache_index_dir: /shared/infinilm/cache-index
  # etcd:
  #   endpoints: 127.0.0.1:2379
  #   prefix: /infinilm

frontend:
  host: 127.0.0.1
  port: 18000
  router_mode: round-robin
  # 未配置时自动等于 CUDA_VISIBLE_DEVICES 中的 GPU 数量。
  # router_min_initial_workers: 3

workers:
  host: 127.0.0.1
  advertise_host: 127.0.0.1
  base_http_port: 18081
  port_offset: 10
  # 注意：不配置 replicas；worker 数量只来自 CUDA_VISIBLE_DEVICES。

engine:
  device: nvidia
  tp: 1
  block_size: 256
  max_new_tokens: 2644
  num_blocks: 500
  max_batch_size: 32
  log_level: INFO
  enable_paged_attn: true
  enable_graph: true
  attn: flash-attn
